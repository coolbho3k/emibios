name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - run: zig version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ hashFiles('build.zig.zon') }}
      - run: zig fmt --check build.zig build.zig.zon tools rom tests
      - run: zig build lint
      - if: always()
        run: git diff --exit-code

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - run: zig version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ hashFiles('build.zig.zon') }}
      - run: zig build verify -Dno-recal=true
      - run: zig build rom -Dno-recal=true
      - run: zig build report -Dno-recal=true
      - name: Check binary sizes
        run: |
          test "$(wc -c < zig-out/bin/gba_bios.bin)" -eq 16384
          test "$(wc -c < zig-out/bin/test_rom.gba)" -eq 1048576
      - if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emibios-${{ github.sha }}
          path: |
            zig-out/bin/gba_bios.bin
            zig-out/bin/bios.elf
            zig-out/bin/test_rom.gba
            bios.sha256
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.emu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        emu: [gbahawk, mesence]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - run: zig version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ hashFiles('build.zig.zon') }}
      - run: zig build verify -Dno-recal=true
      - run: zig build test -Dno-recal=true -Demu=${{ matrix.emu }} --test-timeout 1800s --summary all
      - if: always()
        run: git diff --exit-code
